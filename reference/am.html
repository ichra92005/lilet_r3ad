<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Android Development - Complete Study Guide</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e2d4a;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --accent3: #8b5cf6;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
    animation: bgPulse 12s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes bgPulse { from{transform:scale(1)} to{transform:scale(1.05) rotate(2deg)} }

  header {
    position: sticky; top:0; z-index:100;
    background: rgba(10,15,30,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex; align-items: center; gap:16px;
    flex-wrap: wrap;
  }
  .logo { font-size:1.3rem; font-weight:800; }
  .logo span { color: var(--accent); }

  nav { display:flex; gap:8px; flex-wrap:wrap; flex:1; }
  .tab-btn {
    padding: 8px 16px; border-radius:8px; font-size:0.8rem; font-weight:600;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); cursor:pointer; transition: all 0.2s;
  }
  .tab-btn:hover { border-color: var(--accent); color:var(--text); }
  .tab-btn.active { background: var(--accent); border-color:var(--accent); color:#fff; }

  main { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:24px 16px; }

  .section { display:none; }
  .section.active { display:block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  .chapter-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:16px; margin-bottom:24px; }

  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:16px; padding:20px;
    cursor:pointer; transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .chapter-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background: var(--card-color, var(--accent));
  }
  .chapter-card:hover { transform:translateY(-4px); border-color: var(--accent); }
  .chapter-card.selected { border-color:var(--accent); background:var(--surface2); }
  .chapter-card .icon { font-size:2rem; margin-bottom:10px; }
  .chapter-card h3 { font-size:0.95rem; font-weight:700; margin-bottom:8px; }
  .chapter-card p { font-size:0.78rem; color:var(--muted); line-height:1.5; }
  .chapter-card .badge { position:absolute; top:14px; right:14px; background: rgba(59,130,246,0.15); color:var(--accent); font-size:0.7rem; padding:4px 10px; border-radius:20px; font-weight:600; }

  .content-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:16px; padding:28px;
    line-height:1.8;
    margin-bottom: 24px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .content-panel h2 { font-size:1.5rem; font-weight:800; margin-bottom:20px; color:var(--accent2); }
  .content-panel h3 { font-size:1.1rem; font-weight:700; margin: 28px 0 12px; color:var(--accent); }
  .content-panel h4 { font-size:0.95rem; font-weight:600; margin: 16px 0 8px; color:var(--accent3); }
  .content-panel p { margin-bottom:12px; font-size:0.88rem; color:#cbd5e1; }
  .content-panel ul { padding-left:24px; margin-bottom:12px; }
  .content-panel li { font-size:0.88rem; margin-bottom:6px; color:#cbd5e1; }

  .code-block {
    background:#0d1117; border:1px solid #30363d;
    border-radius:10px; padding:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem; line-height:1.5;
    overflow-x:auto; margin:12px 0;
    color:#c9d1d9;
  }
  .code-block .kw { color:#ff79c6; }
  .code-block .str { color:#f1fa8c; }
  .code-block .cm { color:#6272a4; font-style:italic; }
  .code-block .fn { color:#50fa7b; }

  .flashcard-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .flashcard { perspective:1000px; cursor:pointer; height:200px; }
  .fc-inner {
    position:relative; width:100%; height:100%;
    transition: transform 0.55s;
    transform-style:preserve-3d;
  }
  .flashcard.flipped .fc-inner { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    position:absolute; width:100%; height:100%;
    backface-visibility:hidden; border-radius:14px; padding:20px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:0.85rem; line-height:1.5;
    border: 1px solid var(--border);
  }
  .fc-front {
    background: var(--surface2);
    color: var(--text); font-weight:600;
  }
  .fc-back {
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
    border:1px solid var(--accent);
    transform: rotateY(180deg);
    color:#e2e8f0; font-size:0.8rem;
    font-family:'JetBrains Mono',monospace;
  }

  .quiz-container { max-width:780px; margin:0 auto; }
  .quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .quiz-score { font-size:0.9rem; font-weight:700; color:var(--green); }
  .quiz-chapter-select {
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); padding:10px 16px; border-radius:8px;
    font-size:0.85rem; cursor:pointer;
  }

  .question-card {
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:16px; padding:24px;
    margin-bottom:16px;
  }
  .question-num { font-size:0.75rem; color:var(--muted); font-weight:600; letter-spacing:1px; margin-bottom:10px; }
  .question-text { font-size:0.95rem; font-weight:600; line-height:1.6; margin-bottom:18px; }

  .options { display:flex; flex-direction:column; gap:10px; }
  .option-btn {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:12px 16px;
    text-align:left; font-size:0.85rem; color:var(--text); cursor:pointer;
    transition:all 0.2s; display:flex; align-items:center; gap:10px;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(59,130,246,0.1); }
  .option-btn.correct { border-color:var(--green); background:rgba(16,185,129,0.15); color:var(--green); }
  .option-btn.wrong { border-color:var(--red); background:rgba(239,68,68,0.15); color:var(--red); }
  .option-btn:disabled { cursor:default; }
  .option-letter {
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,0.08); display:flex;
    align-items:center; justify-content:center;
    font-size:0.75rem; font-weight:700; flex-shrink:0;
  }

  .explanation {
    margin-top:14px; padding:12px 16px;
    background:rgba(59,130,246,0.08); border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0; font-size:0.82rem; color:#94a3b8;

  .btn {
    padding:10px 24px; border-radius:10px; font-weight:700;
    font-size:0.85rem;
    cursor:pointer; transition:all 0.2s; border:none;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#2563eb; }
  .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { border-color:var(--accent); }

  .stats-bar {
    display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px;
  }
  .stat-pill {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:10px 16px;
    display:flex; align-items:center; gap:8px;
    font-size:0.82rem;
  }
  .stat-pill .num { font-size:1.2rem; font-weight:800; color:var(--accent); }

  .section-title {
    font-size:1.8rem; font-weight:800; margin-bottom:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .section-sub { font-size:0.85rem; color:var(--muted); margin-bottom:24px; }

  .tabs-small { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-small {
    padding:8px 16px; border-radius:8px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--muted); cursor:pointer; font-weight:600;
    font-size:0.8rem; transition:all 0.2s;
  }
  .tab-small.active { background:var(--accent3); border-color:var(--accent3); color:#fff; }

  @media(max-width:600px) {
    .chapter-grid { grid-template-columns:1fr; }
    .flashcard-grid { grid-template-columns:1fr; }
    main { padding:16px 12px; }
  }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>

  content: `
<h2>📱 Introduction to Mobile Development</h2>

<h3>Mobile Operating Systems</h3>
<p>A mobile operating system is designed to run on mobile devices. It manages:</p>
<ul>
  <li><strong>Wireless connectivity</strong> (WiFi, 3G/4G/5G, Bluetooth)</li>
  <li><strong>User interfaces</strong> adapted for touch screens</li>
  <li><strong>Internet & communication</strong> (browsing, phone calls, SMS)</li>
  <li><strong>Memory management</strong> and <strong>process management</strong></li>
</ul>

<h4>Popular Mobile Operating Systems:</h4>
<ul>
  <li><strong>iOS</strong> (Apple) – Closed ecosystem, App Store</li>
  <li><strong>Android</strong> (Google) – Open source, Google Play</li>
  <li><strong>Windows Mobile</strong> (Microsoft) – Discontinued</li>
  <li><strong>HarmonyOS</strong> (Huawei) – Emerging platform</li>
</ul>

<h3>Mobile Application Definition</h3>
<p>A mobile application is a program designed for smartphones, tablets, or PDAs. It must be:</p>
<ul>
  <li><strong>Adapted</strong> to different device sizes and OS</li>
  <li><strong>Ergonomic</strong> for touch-based interaction</li>
  <li><strong>Efficient</strong> with limited power and bandwidth</li>
  <li><strong>Distributed</strong> via app stores (App Store, Google Play, etc.)</li>
</ul>

<h3>Development Constraints</h3>
<h4>Device Characteristics:</h4>
<ul>
  <li>💪 <strong>Power consumption</strong> – Limited battery life</li>
  <li>⚙️ <strong>Computing capacity</strong> – Less RAM/CPU than desktops</li>
  <li>🌐 <strong>Connectivity</strong> – Intermittent, varying speeds</li>
  <li>📦 <strong>Storage</strong> – Limited internal storage</li>
  <li>🔀 <strong>OS heterogeneity</strong> – Multiple OS and versions</li>
</ul>

<h4>Time to Market (TTM):</h4>
<p>TTM = time between product design and market release. Critical for mobile apps where products become obsolete quickly.</p>

<h3>🔄 Development Approaches Comparison</h3>

<h3>1. Generic (Web) Development</h3>
<p><strong>Definition:</strong> HTML/CSS/JavaScript websites accessed via mobile browser</p>

<h4>Advantages:</h4>
<ul>
  <li>Simplest approach – just HTML/CSS</li>
  <li>No download required – access from any device</li>
  <li>Universal reach – all devices with browser</li>
</ul>

<h4>Disadvantages:</h4>
<ul>
  <li>Poor performance – slow loading</li>
  <li>No native features – no GPS, camera, contacts access</li>
  <li>Internet required – cannot work offline</li>
  <li>Inconsistent UX – different behavior per browser</li>
</ul>

<h4>Sub-types:</h4>
<ul>
  <li><strong>Dedicated Site:</strong> Separate URLs per device type (m.example.com for mobile)</li>
  <li><strong>Responsive Web Design:</strong> Single site that adapts to any screen size using HTML/CSS media queries</li>
</ul>

<div class="code-block">
&lt;!-- Responsive Web Design Example --&gt;<br/>
&lt;meta name="viewport" content="width=device-width"&gt;<br/>
&lt;style&gt;<br/>
  @media (max-width: 768px) {<br/>
    .container { width: 100%; }<br/>
  }<br/>
&lt;/style&gt;
</div>

<h3>2. Native Development</h3>
<p><strong>Definition:</strong> Apps built with platform-specific language and tools</p>

<h4>Languages:</h4>
<ul>
  <li>Android: <strong>Java</strong> or <strong>Kotlin</strong></li>
  <li>iOS: <strong>Swift</strong> or <strong>Objective-C</strong></li>
</ul>

<h4>Advantages:</h4>
<ul>
  <li>✅ <strong>High performance</strong> – Optimized for platform</li>
  <li>✅ <strong>Full hardware access</strong> – GPS, camera, accelerometer, contacts, calendar</li>
  <li>✅ <strong>Native look & feel</strong> – Matches OS design patterns</li>
  <li>✅ <strong>Offline capable</strong> – Works without internet</li>
</ul>

<h4>Disadvantages:</h4>
<ul>
  <li>❌ <strong>High cost</strong> – Separate version per OS</li>
  <li>❌ <strong>More maintenance</strong> – Updates × number of platforms</li>
  <li>❌ <strong>Requires specialists</strong> – Need Java, Swift, Kotlin experts</li>
</ul>

<div class="code-block">
<span class="cm">// Native Android Example (Java)</span><br/>
<span class="kw">public class</span> MainActivity <span class="kw">extends</span> AppCompatActivity {<br/>
&nbsp;&nbsp;<span class="kw">protected void</span> onCreate(Bundle savedInstanceState) {<br/>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">super</span>.onCreate(savedInstanceState);<br/>
&nbsp;&nbsp;&nbsp;&nbsp;setContentView(R.layout.activity_main);<br/>
&nbsp;&nbsp;}<br/>
}
</div>

<h3>3. Cross-Platform / Hybrid Development</h3>
<p><strong>Definition:</strong> Single codebase generates apps for multiple OS</p>

<h4>Two Sub-types:</h4>

<h4>A) Hybrid Web-Oriented (~80% web + ~20% native)</h4>
<ul>
  <li><strong>Technologies:</strong> HTML5, CSS3, JavaScript + native bridge</li>
  <li><strong>Frameworks:</strong> Apache Cordova, PhoneGap, Titanium</li>
  <li><strong>Advantage:</strong> Reduce cost, shared codebase</li>
  <li><strong>Disadvantage:</strong> Limited performance, limited native features</li>
</ul>

<div class="code-block">
<span class="cm">// Hybrid App with Cordova/PhoneGap</span><br/>
&lt;!DOCTYPE html&gt;<br/>
&lt;script src="cordova.js"&gt;&lt;/script&gt;<br/>
&lt;script&gt;<br/>
&nbsp;&nbsp;navigator.geolocation.getCurrentPosition(<span class="fn">success</span>);<br/>
&lt;/script&gt;
</div>

<h4>B) Generated Native (Compile single source → native code per OS)</h4>
<ul>
  <li><strong>Frameworks:</strong> Xamarin (C#), Appcelerator (JS), Adobe Air (AS3)</li>
  <li><strong>Advantage:</strong> Better performance than web-based hybrid</li>
  <li><strong>Disadvantage:</strong> Still requires platform-specific knowledge</li>
</ul>

<h3>Comparison Summary</h3>
<table style="width:100%; border-collapse: collapse; margin: 16px 0;">
  <tr style="background: rgba(59,130,246,0.1);">

  </tr>
  <tr>

    <td style="border: 1px solid var(--border); padding: 8px;">Partial</td>
  </tr>
</table>
  `,

<h2>🤖 Android Platform Architecture</h2>

<h3>Layered Architecture</h3>
<p>Android uses a 6-layer architecture from top to bottom:</p>

<h3>Layer 1: Application Layer</h3>
<p><strong>Accessible to users.</strong> Contains pre-installed Java applications:</p>
<ul>
  <li>Home screen, Calendar, Email client</li>
  <li>Browser, Camera, Gallery, Maps</li>
  <li>SMS/Phone, Settings, Clock</li>
</ul>

<h3>Layer 2: Application Framework</h3>
<p><strong>Reusable components.</strong> Services for app development:</p>
<ul>
  <li><strong>Activity Manager:</strong> Manages activity lifecycle and stack</li>
  <li><strong>Content Provider:</strong> Share data between apps</li>
  <li><strong>Window Manager:</strong> Manages windows and UI</li>
  <li><strong>Resource Manager:</strong> Access layouts, strings, images</li>
  <li><strong>Notification Manager:</strong> Display system notifications</li>
</ul>

<h3>Layer 3: Libraries (C/C++)</h3>
<p>Native libraries accessible through the framework:</p>
<ul>
  <li><strong>libc:</strong> Standard C library optimized for embedded systems</li>
  <li><strong>Multimedia:</strong> Support MPEG4, MP3, JPG, PNG, WebM, WebP</li>
  <li><strong>FreeType:</strong> Font rendering engine for vector fonts</li>
  <li><strong>SQLite:</strong> Embedded relational database</li>
  <li><strong>OpenGL ES:</strong> 3D graphics rendering</li>
</ul>

<h3>Layer 4: Runtime Engine (Virtual Machines)</h3>

<h4>Dalvik VM (Legacy)</h4>
<p><strong>Adapted for limited memory and processing power.</strong> Each app runs in its own Dalvik instance.</p>

<div class="code-block">
<span class="cm">// Build Pipeline with Dalvik</span><br/>
Source Code (.java)<br/>
  ↓ Java Compiler<br/>
Bytecode (.class)<br/>
  ↓ Dex Compiler (dx)<br/>

  ↓ Dexopt Tool<br/>
Optimized Dex (.odex)<br/>
  ↓ JIT Compiler (at runtime)<br/>
Dalvik VM Execution
</div>

<h4>JIT (Just-In-Time) Compilation (Android 2.2+):</h4>
<ul>
  <li>Interprets bytecode line-by-line initially</li>
  <li>When function identified as "hotspot", JIT compiles to native code</li>
  <li>Dexopt tool creates .odex files with optimized opcodes</li>

<h4>ART (Android Runtime) - Modern Approach</h4>

<div class="code-block">

<h2>🧩 Android Application Components</h2>

<h3>Application Structure</h3>
<p>Every Android app contains three main elements:</p>
<ul>
  <li><strong>Activities:</strong> Screens/UI with Views</li>
  <li><strong>Resources:</strong> Layouts (XML), strings, images, colors, videos</li>
  <li><strong>AndroidManifest.xml:</strong> App configuration and metadata</li>
</ul>

<h3>Activity</h3>
<p><strong>The basic building block of Android UI.</strong> Each Activity represents one screen.</p>

<h4>Key Points:</h4>
<ul>
  <li>Inherits from <strong>android.app.Activity</strong> class</li>
  <li>Contains Java/Kotlin code and manages Views</li>
  <li>Each Activity typically has one associated layout XML file</li>
  <li>An app can have multiple activities (multi-screen)</li>
  <li>Activities can exist without UI (background services)</li>
</ul>

<div class="code-block">
<span class="kw">public class</span> MainActivity <span class="kw">extends</span> AppCompatActivity {<br/>
&nbsp;&nbsp;<span class="kw">@Override</span><br/>
&nbsp;&nbsp;<span class="kw">protected void</span> onCreate(Bundle savedInstanceState) {<br/>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">super</span>.onCreate(savedInstanceState);<br/>
&nbsp;&nbsp;&nbsp;&nbsp;setContentView(R.layout.activity_main);<br/>
&nbsp;&nbsp;&nbsp;&nbsp;<br/>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// Get UI elements by ID</span><br/>
&nbsp;&nbsp;&nbsp;&nbsp;Button myButton = findViewById(R.id.myButton);<br/>
&nbsp;&nbsp;&nbsp;&nbsp;myButton.setOnClickListener(v -> {<br/>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Toast.makeText(this, <span class="str">"Button clicked!"</span>, Toast.LENGTH_SHORT).show();<br/>
&nbsp;&nbsp;&nbsp;&nbsp;});<br/>
&nbsp;&nbsp;}<br/>
}
</div>

<h3>Activity Lifecycle</h3>
<p><strong>Activities are managed as a STACK.</strong></p>

<h4>Stack Behavior:</h4>
<ul>
  <li>New activity launched → pushed on top (foreground)</li>
  <li>Previous activity → pushed down (background, partially visible)</li>
  <li>When activity finishes → popped from stack</li>
</ul>

<h4>Lifecycle States & Callbacks:</h4>

<table style="width:100%; border-collapse: collapse; margin: 16px 0;">
  <tr style="background: rgba(59,130,246,0.1);">
    <th style="border: 1px solid var(--border); padding: 8px;">State</th>
    <th style="border: 1px solid var(--border); padding: 8px;">Callback</th>
    <th style="border: 1px solid var(--border); padding: 8px;">Description</th>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Created</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onCreate()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Activity first created</td>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Started</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onStart()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Activity becoming visible</td>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Resumed</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onResume()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Activity in foreground, interactive</td>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Paused</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onPause()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Another activity gaining focus</td>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Stopped</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onStop()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Activity not visible</td>
  </tr>
  <tr>
    <td style="border: 1px solid var(--border); padding: 8px;">Destroyed</td>
    <td style="border: 1px solid var(--border); padding: 8px;">onDestroy()</td>
    <td style="border: 1px solid var(--border); padding: 8px;">Activity being removed</td>
  </tr>
</table>

<h4>Complete Lifecycle Order:</h4>
<div class="code-block">
onCreate() → onStart() → onResume() → [Running] 
  ↓ (another activity comes to foreground)
onPause() → onStop() → onDestroy()
  ↓ (if user returns)
onRestart() → onStart() → onResume()
</div>

<h3>Key Lifecycle Methods</h3>

<h4>onCreate(Bundle savedInstanceState)</h4>
<p>Called when activity first created. <strong>Required method to override.</strong></p>
<ul>
  <li>Initialize resources and UI</li>
  <li>Load layout XML with setContentView()</li>
  <li>Get references to UI elements with findViewById()</li>
  <li>Register listeners</li>
  <li>Bundle parameter: restore state data from previous instance</li>
</ul>

<div class="code-block">
<span class="kw">@Override</span><br/>
<span class="kw">protected void</span> onCreate(Bundle savedInstanceState) {<br/>
&nbsp;&nbsp;<span class="kw">super</span>.onCreate(savedInstanceState);<br/>
&nbsp;&nbsp;setContentView(R.layout.activity_main);<br/>
&nbsp;&nbsp;<br/>
&nbsp;&nbsp;<span class="cm">// Restore state if needed</span><br/>
&nbsp;&nbsp;<span class="kw">if</span> (savedInstanceState != <span class="kw">null</span>) {<br/>
&nbsp;&nbsp;&nbsp;&nbsp;String value = savedInstanceState.getString(<span class="str">"key"</span>);<br/>
&nbsp;&nbsp;}<br/>
}
</div>

<h4>onPause()</h4>
<p>Called when activity loses focus (another activity comes to foreground).</p>
<ul>
  <li>Activity is partially visible but not interactive</li>
  <li>Save data that should persist</li>
  <li>Stop animations or background work</li>
  <li>Release resources (database connections, camera, GPS)</li>
</ul>

<div class="code-block">
<span class="kw">@Override</span><br/>
<span class="kw">protected void</span> onPause() {<br/>
&nbsp;&nbsp;<span class="kw">super</span>.onPause();<br/>
&nbsp;&nbsp;<span class="cm">// Save data to SharedPreferences</span><br/>
&nbsp;&nbsp;SharedPreferences prefs = getSharedPreferences(<span class="str">"myPrefs"</span>, MODE_PRIVATE);<br/>
&nbsp;&nbsp;prefs.edit().putString(<span class="str">"saved_text"</span>, editText.getText().toString()).apply();<br/>
&nbsp;&nbsp;<br/>
&nbsp;&nbsp;<span class="cm">// Stop tracking location</span><br/>
&nbsp;&nbsp;locationManager.removeUpdates(locationListener);<br/>
}
</div>

<h4>onResume()</h4>
<p>Called when activity regains focus (comes to foreground).</p>
<ul>
  <li>Activity is now interactive</li>
  <li>Resume animations or background work</li>
  <li>Acquire resources (camera, GPS, sensors)</li>

<h4>onDestroy()</h4>

<h3>AndroidManifest.xml</h3>

<h4>Required Manifest Elements:</h4>
<ul>
  <li><strong>&lt;manifest&gt;:</strong> Root element, contains package name</li>

<h3>Intent</h3>
<p><strong>An abstract description of an operation to perform.</strong> Mediates communication between components.</p>

<h4>Common Uses:</h4>

<h4>Intent Types:</h4>

<h2>🔀 Intents & Interactions Between Components</h2>

<h3>What is an Intent?</h3>
<p><strong>Abstract description of an operation to perform.</strong> Enables communication between Android components.</p>

<h4>Common Uses:</h4>

<div class="code-block">

<h3>Passing Data Between Activities</h3>

<div class="code-block">
Intent intent = <span class="kw">new</span> Intent(MainActivity.<span class="kw">this</span>, SecondActivity.<span class="kw">class</span>);<br/>

&nbsp;&nbsp;setContentView(R.layout.activity_second);<br/>
&nbsp;&nbsp;<br/>
&nbsp;&nbsp;Bundle extras = getIntent().getExtras();<br/>
&nbsp;&nbsp;<span class="kw">if</span> (extras != <span class="kw">null</span>) {<br/>
&nbsp;&nbsp;&nbsp;&nbsp;String username = extras.getString(<span class="str">"username"</span>);<br/>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">int</span> age = extras.getInt(<span class="str">"age"</span>, 0);<br/>
&nbsp;&nbsp;}<br/>

<h3>startActivityForResult</h3>

<div class="code-block">

<span class="kw">int</span> REQUEST_CODE = 1;<br/>
Intent intent = <span class="kw">new</span> Intent(MainActivity.<span class="kw">this</span>, SecondActivity.<span class="kw">class</span>);<br/>

<span class="cm">// Handle result</span><br/>

let currentFlashcards = [];
let quizState = { questions: [], answered: 0, score: 0 };

document.addEventListener('DOMContentLoaded', () => {
  buildCourseTabs();
  buildFlashcardFilter();
  buildQuizSelects();
  renderFlashcards();
  startQuiz();
});

function buildCourseTabs() {
  const tabs = document.getElementById('courseTabs');
  tabs.innerHTML = CHAPTERS.map(ch => `
    <button class="tab-small" onclick="showChapterContent(${ch.id})">
      ${ch.icon} ${ch.title.split('–')[1].trim()}
    </button>
  `).join('');
}

function showChapterContent(id) {
  const ch = CHAPTERS.find(c => c.id === id);
  const panel = document.getElementById('contentPanel');
  panel.innerHTML = ch.content;
  panel.style.display = 'block';
  document.querySelectorAll('.tab-small').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  panel.scrollIntoView({ behavior: 'smooth' });
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.currentTarget.classList.add('active');
}

function buildFlashcardFilter() {
  const sel = document.getElementById('fcChapterFilter');
  CHAPTERS.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch.id;
    opt.textContent = ch.icon + ' ' + ch.title;
    sel.appendChild(opt);
  });
}

function renderFlashcards() {
  const filter = document.getElementById('fcChapterFilter').value;
  let cards = [];
  if (filter === 'all') {
    CHAPTERS.forEach(ch => ch.flashcards.forEach(fc => cards.push({...fc, chapter: ch.title})));
  } else {
    const ch = CHAPTERS.find(c => c.id == filter);
    if (ch) cards = ch.flashcards.map(fc => ({...fc, chapter: ch.title}));
  }
  document.getElementById('fcCount').textContent = `${cards.length} cards`;
  const grid = document.getElementById('flashcardGrid');
  grid.innerHTML = cards.map((fc, i) => `
    <div class="flashcard" onclick="this.classList.toggle('flipped')">
      <div class="fc-inner">
        <div class="fc-front">
          <div>
            <div style="font-size:0.65rem; color:var(--muted); margin-bottom:8px;">${fc.chapter}</div>
            ${fc.front}
          </div>
        </div>
        <div class="fc-back">${fc.back.replace(/\n/g, '<br>')}</div>
      </div>
    </div>
  `).join('');
}

function buildQuizSelects() {
  const sel = document.getElementById('quizChapterSelect');
  CHAPTERS.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch.id;
    opt.textContent = ch.icon + ' ' + ch.title;
    sel.appendChild(opt);
  });
}

function startQuiz() {
  const filter = document.getElementById('quizChapterSelect').value;
  let allQ = [];
  if (filter === 'all') {
    CHAPTERS.forEach(ch => ch.quiz.forEach(q => allQ.push({...q, ch: ch.title})));
  } else {
    const ch = CHAPTERS.find(c => c.id == filter);
    if (ch) allQ = ch.quiz.map(q => ({...q, ch: ch.title}));
  }
  allQ = allQ.sort(() => Math.random() - 0.5);
  quizState = { questions: allQ, answered: 0, score: 0, total: allQ.length };
  renderQuizStats();
  renderQuizQuestions();
}

function renderQuizStats() {
  const bar = document.getElementById('quizStatsBar');
  bar.innerHTML = `
    <div class="stat-pill"><span class="num">${quizState.total}</span> Questions</div>
    <div class="stat-pill"><span class="num" id="statAnswered">0</span> Answered</div>
    <div class="stat-pill"><span class="num" id="statScore" style="color:var(--green)">0</span> Correct</div>
  `;
}

function renderQuizQuestions() {
  const container = document.getElementById('quizContainer');
  const letters = ['A', 'B', 'C', 'D'];
  container.innerHTML = quizState.questions.map((q, qi) => `
    <div class="question-card">
      <div class="question-num">Q${qi+1} / ${quizState.questions.length} — ${q.ch}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <button class="option-btn" id="opt-${qi}-${oi}" onclick="answerQuestion(${qi}, ${oi})">
            <span class="option-letter">${letters[oi]}</span>
            ${opt}
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp-${qi}">${q.explanation || ''}</div>
    </div>
  `).join('');
}

function answerQuestion(qi, chosenIdx) {
  const q = quizState.questions[qi];
  const btns = document.querySelectorAll(`[id^="opt-${qi}-"]`);
  if (btns[0].disabled) return;
  btns.forEach(b => b.disabled = true);
  const correct = q.answer;
  btns[chosenIdx].classList.add(chosenIdx === correct ? 'correct' : 'wrong');
  if (chosenIdx !== correct) btns[correct].classList.add('correct');
  document.getElementById(`exp-${qi}`).classList.add('show');
  if (chosenIdx === correct) quizState.score++;
  quizState.answered++;
  document.getElementById('statAnswered').textContent = quizState.answered;
  document.getElementById('statScore').textContent = quizState.score;
  document.getElementById('quizScoreDisplay').textContent = `Score: ${quizState.score} / ${quizState.answered}`;
}

</script>
